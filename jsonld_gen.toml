# ============================================================
# jsonld_gen.toml
# JSON-LD 骨架生成器输入（独立 schema，不是 "TOML 3.0"）
# 与 trig_fsm_gen 的 TOML 并列，不共享 schema 语义；
# 字段形制参考友包 src/fsm 的 TOML 2.0（具名引用 / 形态判断 / 缺省即终点）。
#
# 三表职责：
#   [[steps]]            步骤表        —— expansion/toRDF 的算法步骤骨架，handler_hook 指向手写
#   [[keyword_dispatch]] 关键字分派表  —— @xxx → action 映射，condition 只收可枚举形态判断
#   [[iri_rules]]        IRI 规则表    —— 规则顺序 + condition + action 名
#
# 红线：递归策略、搜索剪枝、工程权衡一律不进表；condition 只收可枚举的形态判断；
#       handler_hook 只指向手写 trait 方法（无手写的行不得带此键）。
# 判据：表里能 grep 出"递归/深度/策略"的行级编码，就是设计错误。
# ============================================================

schema_version = "1.0"
generator      = "jsonld_gen"
target_package = "src/jsonld"

# ============================================================
# 步骤表：算法步骤序列（每条 = 一个可枚举的调度单元）
# next 单值；缺省 next = 本阶段终点。
# dispatch（可选）= 形态 → 步骤 的枚举映射，由骨架生成 match 分派。
# ============================================================

# ---------- expansion 阶段 ----------

[[steps]]
id    = "expansion.entry"
phase = "expansion"
order = 1
name  = "expand_element"
# 算法入口：按元素形态分派（null 计入 scalar；@context 属关键字分派表，不在入口分派）
dispatch = { scalar = "expansion.expand_value", array = "expansion.expand_array", object = "expansion.expand_object" }

[[steps]]
id           = "expansion.expand_value"
phase        = "expansion"
order        = 2
name         = "expand_value"
next         = "expansion.postprocess"
handler_hook = "Expander::expand_value"   # 手写实现（null → 空）

[[steps]]
id           = "expansion.expand_array"
phase        = "expansion"
order        = 3
name         = "expand_array"
# 逐元素处理在手写钩子内完成，步骤图保持无环
next         = "expansion.postprocess"
handler_hook = "Expander::expand_array"   # 手写实现

[[steps]]
id    = "expansion.expand_object"
phase = "expansion"
order = 4
name  = "expand_object"
# 属性循环 = 机械枚举：逐键查 keyword_dispatch 分派，各臂实现在对应行的 handler_hook
next  = "expansion.postprocess"

[[steps]]
id           = "expansion.postprocess"
phase        = "expansion"
order        = 5
name         = "postprocess_value"
# @value 形态归一、@type/@language 归位；本阶段终点（无 next）
handler_hook = "Expander::postprocess_value"   # 手写实现

# ---------- toRDF 阶段 ----------

[[steps]]
id           = "torf.entry"
phase        = "toRDF"
order        = 1
name         = "node_to_quads"
# 遍历展开后的节点图，产四元组
next         = "torf.emit"
handler_hook = "ToRdfProcessor::node_to_quads"   # 手写实现

[[steps]]
id    = "torf.emit"
phase = "toRDF"
order = 2
name  = "emit_quads"
# 四元组出账走既有发射通道；本阶段终点（无 next）

# ============================================================
# 关键字分派表：@xxx 关键字 → 处理分支（每条 = 一个可枚举的分支）
# condition 词表（形态判断）：string / string_or_string_array / scalar_or_null /
#   ltr_or_rtl / array_or_object / any / object / object_or_array / default
# result 词表（展开形态）：iri / value_object / list_object / array / graph /
#   property / index / context（随 J2 对拍校准）
# ============================================================

[[keyword_dispatch]]
keyword      = "@id"
condition    = "string"
action       = "expand_iri"
result       = "iri"
args         = { vocab = false, document_relative = true }
handler_hook = "IriExpander::expand_iri"

[[keyword_dispatch]]
keyword      = "@type"
condition    = "string_or_string_array"
action       = "expand_iri"
result       = "iri"
args         = { vocab = true, document_relative = false }
handler_hook = "IriExpander::expand_iri"

[[keyword_dispatch]]
keyword      = "@value"
condition    = "scalar_or_null"
action       = "expand_value"
result       = "value_object"
handler_hook = "Expander::expand_value"

[[keyword_dispatch]]
keyword      = "@language"
condition    = "string"
action       = "set_language"
result       = "value_object"
handler_hook = "Expander::set_language"

[[keyword_dispatch]]
keyword      = "@direction"
condition    = "ltr_or_rtl"
action       = "set_direction"
result       = "value_object"
handler_hook = "Expander::set_direction"

[[keyword_dispatch]]
keyword      = "@list"
condition    = "array_or_object"
action       = "expand_list"
result       = "list_object"
handler_hook = "Expander::expand_list"

[[keyword_dispatch]]
keyword      = "@set"
condition    = "any"
action       = "expand_set"
result       = "array"
handler_hook = "Expander::expand_set"

[[keyword_dispatch]]
keyword      = "@graph"
condition    = "any"
action       = "expand_graph"
result       = "graph"
handler_hook = "Expander::expand_graph"

[[keyword_dispatch]]
keyword      = "@reverse"
condition    = "object"
action       = "expand_reverse"
result       = "property"
handler_hook = "Expander::expand_reverse"

[[keyword_dispatch]]
keyword      = "@nest"
condition    = "object"
action       = "expand_nest"
result       = "property"
handler_hook = "Expander::expand_nest"

[[keyword_dispatch]]
keyword      = "@included"
condition    = "object_or_array"
action       = "expand_included"
result       = "array"
handler_hook = "Expander::expand_included"

[[keyword_dispatch]]
keyword      = "@index"
condition    = "string"
action       = "set_index"
result       = "index"
handler_hook = "Expander::set_index"

[[keyword_dispatch]]
keyword      = "@context"
condition    = "object_or_array"
action       = "process_context"
result       = "context"
handler_hook = "ContextProcessor::process_context"

# 缺省臂：非关键字键 = term 展开
[[keyword_dispatch]]
keyword      = "_term"
condition    = "default"
action       = "expand_term"
result       = "property"
handler_hook = "Expander::expand_term"

# ============================================================
# IRI 规则表：IRI 展开规则（order = 求值顺序，逐条试下）
# condition 词表（形态判断）：starts_with_at / has_valid_scheme / is_bnode /
#   has_prefix / vocab_base_set / base_set / term_defined
# 无手写的行（原样返回类）不带 handler_hook，由骨架给缺省实现。
# ============================================================

[[iri_rules]]
order        = 1
kind         = "keyword"
condition    = "starts_with_at"
action       = "return_keyword"
handler_hook = "IriExpander::handle_keyword"

[[iri_rules]]
order        = 2
kind         = "term"
condition    = "term_defined"
action       = "lookup_term"
handler_hook = "IriExpander::lookup_term"

[[iri_rules]]
order     = 3
kind      = "bnode"
condition = "is_bnode"
action    = "return_as_is"
# blank node 原样返回（骨架缺省实现）

[[iri_rules]]
order        = 4
kind         = "compact"
condition    = "has_prefix"
action       = "expand_compact"
handler_hook = "IriExpander::expand_compact"

[[iri_rules]]
order     = 5
kind      = "absolute"
condition = "has_valid_scheme"
action    = "return_as_is"
# 绝对 IRI 原样返回（骨架缺省实现）

[[iri_rules]]
order        = 6
kind         = "vocab"
condition    = "vocab_base_set"
action       = "concat_vocab"
handler_hook = "IriExpander::concat_vocab"

[[iri_rules]]
order        = 7
kind         = "relative"
condition    = "base_set"
action       = "resolve_base"
handler_hook = "IriExpander::resolve_base"
